<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anniececy.com | Expedición Biodiversidad Bolivia</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --cr-color: #ef4444;
      --en-color: #f97316;
      --vu-color: #eab308;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    header {
      width: 100%;
      max-width: 900px;
      text-align: center;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .meta-bar {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      padding: 0.75rem;
      border-radius: 8px;
      margin-top: 1rem;
      border: 1px solid var(--border);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-size: 1.2rem;
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin-top: 1.5rem;
      display: grid;
      gap: 1.5rem;
    }

    .region-nav {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
    }

    .region-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .region-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .badge-cr { background: var(--cr-color); color: #fff; }
    .badge-en { background: var(--en-color); color: #fff; }
    .badge-vu { background: var(--vu-color); color: #000; }

    .threat-desc {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid var(--cr-color);
      padding: 0.75rem;
      margin: 1rem 0;
      font-size: 0.95rem;
      color: #fca5a5;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    @media (min-width: 600px) {
      .action-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .action-btn {
      background: #334155;
      border: 1px solid #475569;
      color: var(--text);
      padding: 1rem;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: #475569;
    }

    .log {
      margin-top: 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
      padding: 1rem;
      border-radius: 6px;
      display: none;
    }

    .log-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--accent); }
    .log-failure { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--cr-color); }
  </style>
</head>
<body>

  <header>
    <h1>anniececy.com</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Simulador Táctico de Conservación — Fauna Silvestre de Bolivia</p>
    <div class="meta-bar">
      <div>
        <div class="stat-label">Presupuesto de Gestión</div>
        <div class="stat-val" id="budget">$100,000</div>
      </div>
      <div>
        <div class="stat-label">Especies en Resguardo</div>
        <div class="stat-val" id="saved">0 / 4</div>
      </div>
    </div>
  </header>

  <main>
    <div class="region-nav" id="regionNav"></div>

    <section class="card" id="missionCard">
      <div id="statusBadge" class="badge"></div>
      <h2 id="speciesName" style="font-size: 1.4rem;"></h2>
      <p id="speciesMeta" style="color: var(--text-muted); font-style: italic; margin-bottom: 0.5rem;"></p>
      <div class="threat-desc" id="threatText"></div>

      <h3 style="font-size: 1rem; margin-top: 1rem;">Medida de Manejo a Implementar:</h3>
      <div class="action-grid" id="actionOptions"></div>

      <div class="log" id="actionLog"></div>
    </section>
  </main>

  <script>
    // Datos técnicos y biológicos estructurados desde los tomos del Libro Rojo
    const missions = [
      {
        id: "moxos",
        region: "Llanos de Moxos",
        species: "Podocnemis expansa (Tataruga)",
        meta: "Orden: Testudines | Familia: Podocnemididae | Categoría: EN",
        status: "EN",
        threat: "Saqueo masivo de playas de anidación sobre la cuenca del río Iténez para comercio de carne y huevos, agravado por inundaciones atípicas.",
        actions: [
          {
            text: "Implementar campamentos comunales de vigilancia y traslocación de nidadas amenazadas a corralones de incubación.",
            cost: 25000,
            success: true,
            msg: "Acción respaldada por el modelo comunitario de Versalles: la protección física in situ asegura el reclutamiento y reduce el tráfico ilícito."
          },
          {
            text: "Construir muros de contención de hormigón en las orillas arenosas del cauce fluvial.",
            cost: 40000,
            success: false,
            msg: "Inviable técnica y ecológicamente: destruye el microhábitat hidrológico de desove y fragmenta el acceso natural de las hembras."
          }
        ]
      },
      {
        id: "chiquitania",
        region: "Chiquitanía / Chaco",
        species: "Acanthochelys macrocephala (Galápago)",
        meta: "Orden: Testudines | Familia: Chelidae | Categoría: VU",
        status: "VU",
        threat: "Quemas descontroladas y fuegos recurrentes que eliminan refugios en humedales efímeros durante su periodo de latencia terrestre.",
        actions: [
          {
            text: "Creación de cortafuegos perimetrales y protocolos de gestión del suelo en zonas de amortiguamiento comunal.",
            cost: 20000,
            success: true,
            msg: "Efectivo: protege las áreas de vegetación caducifolia y bordes riparios donde la especie permanece enterrada entre hojarasca."
          },
          {
            text: "Drenar los curichis locales para reubicar a toda la fauna en zoológicos municipales.",
            cost: 30000,
            success: false,
            msg: "Contraproducente: extirpa la población silvestre, elimina el régimen hidrológico natural y satura los centros de custodia ex situ."
          }
        ]
      },
      {
        id: "yungas",
        region: "Bosques de Yungas",
        species: "Telmatobius yuracare (Rana acuática yuracaré)",
        meta: "Orden: Anura | Familia: Telmatobiidae | Categoría: CR",
        status: "CR",
        threat: "Infección crítica por quitridiomicosis (Batrachochytrium dendrobatidis - Bd) combinada con deforestación para agricultura en laderas.",
        actions: [
          {
            text: "Establecer módulos de conservación ex situ (bioseguridad K'ayra) y monitoreo genético de quebradas prístinas.",
            cost: 35000,
            success: true,
            msg: "Crítico y correcto: permite la reproducción en cautiverio libre de Bd mientras se identifican microcuencas de refugio térmico."
          },
          {
            text: "Fumigar los arroyos de cabecera con fungicidas agrícolas comerciales.",
            cost: 15000,
            success: false,
            msg: "Letal: los anfibios presentan piel altamente permeable; los químicos colapsan el equilibrio osmótico y aniquilan la macrofauna bentónica."
          }
        ]
      },
      {
        id: "titicaca",
        region: "Puna / Lago Titicaca",
        species: "Rollandia microptera (Zambullidor del Titicaca)",
        meta: "Orden: Podicipediformes | Familia: Podicipedidae | Categoría: CR",
        status: "CR",
        threat: "Ahogamiento por enmalle en redes agalleras de pesca artesanal, sumado a la degradación por cosecha descontrolada de totorares.",
        actions: [
          {
            text: "Zonificación concertada de áreas de exclusión pesquera en bahías clave de desove y uso de alarmas acústicas/visuales en redes.",
            cost: 20000,
            success: true,
            msg: "Exitoso: reduce la mortalidad por enmalle de esta ave no voladora y asegura la integridad de los totorales para anidación."
          },
          {
            text: "Introducción intensiva de trucha arcoíris para diversificar las fuentes tróficas del lago.",
            cost: 25000,
            success: false,
            msg: "Grave error: la trucha es una especie exótica que compite por recursos y depreda la ictiofauna nativa (Orestias), presa primaria del zambullidor."
          }
        ]
      }
    ];

    let currentBudget = 100000;
    let savedCount = 0;
    let activeIndex = 0;
    const completedMissions = new Set();

    function renderNav() {
      const nav = document.getElementById("regionNav");
      nav.innerHTML = "";
      missions.forEach((m, idx) => {
        const btn = document.createElement("button");
        btn.className = `region-btn ${idx === activeIndex ? "active" : ""}`;
        btn.textContent = m.region;
        btn.onclick = () => {
          activeIndex = idx;
          renderNav();
          renderMission();
        };
        nav.appendChild(btn);
      });
    }

    function renderMission() {
      const m = missions[activeIndex];
      const badge = document.getElementById("statusBadge");
      badge.textContent = m.status === "CR" ? "En Peligro Crítico" : m.status === "EN" ? "En Peligro" : "Vulnerable";
      badge.className = `badge badge-${m.status.toLowerCase()}`;

      document.getElementById("speciesName").textContent = m.species;
      document.getElementById("speciesMeta").textContent = m.meta;
      document.getElementById("threatText").textContent = m.threat;

      const actionsDiv = document.getElementById("actionOptions");
      actionsDiv.innerHTML = "";

      const log = document.getElementById("actionLog");
      log.style.display = "none";

      m.actions.forEach((act) => {
        const btn = document.createElement("button");
        btn.className = "action-btn";
        btn.innerHTML = `<strong>Opción ($${act.cost.toLocaleString()}):</strong><br>${act.text}`;
        btn.disabled = completedMissions.has(m.id);
        btn.onclick = () => executeAction(m, act);
        actionsDiv.appendChild(btn);
      });
    }

    function executeAction(mission, action) {
      const log = document.getElementById("actionLog");
      log.style.display = "block";

      if (currentBudget < action.cost) {
        log.className = "log log-failure";
        log.innerHTML = "<strong>Fondos insuficientes:</strong> No cuentas con presupuesto asignado para costear esta medida técnica.";
        return;
      }

      currentBudget -= action.cost;
      document.getElementById("budget").textContent = `$${currentBudget.toLocaleString()}`;

      if (action.success) {
        log.className = "log log-success";
        log.innerHTML = `<strong>Éxito de Manejo:</strong> ${action.msg}`;
        if (!completedMissions.has(mission.id)) {
          completedMissions.add(mission.id);
          savedCount++;
          document.getElementById("saved").textContent = `${savedCount} / ${missions.length}`;
        }
      } else {
        log.className = "log log-failure";
        log.innerHTML = `<strong>Fallo de Evaluación:</strong> ${action.msg}`;
      }
      renderMission();
    }

    // Inicialización al cargar la página
    renderNav();
    renderMission();
  </script>
</body>
</html>
